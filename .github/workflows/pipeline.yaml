name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Build
        run: nix build .#dockerImage --print-build-logs

      - name: Push arch-specific image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          ./result | gzip --fast | nix run nixpkgs#skopeo -- \
            --insecure-policy copy \
            --dest-creds "${REGISTRY_USER}:${REGISTRY_TOKEN}" \
            docker-archive:/dev/stdin \
            "docker://${IMAGE}:${GITHUB_SHA::12}-${{ matrix.arch }}"

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          SHA="${GITHUB_SHA::12}"

          TAGS=("${SHA}")
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS+=("latest")
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGS+=("${GITHUB_REF_NAME}")
          fi

          for tag in "${TAGS[@]}"; do
            docker buildx imagetools create \
              --tag "${IMAGE}:${tag}" \
              "${IMAGE}:${SHA}-amd64" \
              "${IMAGE}:${SHA}-arm64"
          done
